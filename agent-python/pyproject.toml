[project]
name = "agent-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[deepgram,openai,silero,soniox]>=1.8.11",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.11",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The assistant's instructions are prose, not code -- wrapping would just be noise.
"src/agent/agent.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_any_generics = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
